name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # the server's version; the ledger uses the standard library only
      - name: Bookkeeping rules (moving average cost, dividends, splits)
        run: node --test ledger/tests/calc.test.mjs
      - name: Server unit tests (price cross-check)
        run: python -m unittest discover -s ledger/tests -p "test_*.py"
      - name: Read-only key, end to end
        run: python ledger/tests/e2e_readtoken.py
      - name: Platform sign-in check, end to end
        run: python ledger/tests/e2e_sso.py

  quantlab-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quantlab
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,ml,ai]"  # ai: TradingAgents, for the domestic-data adapter tests
      - run: ruff check src tests scripts
      - run: pytest
      - name: OpenAPI document is up to date
        run: python scripts/export_openapi.py && git diff --exit-code web/openapi.json

  quantlab-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quantlab/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: quantlab/web/package-lock.json
      - run: npm ci
      - name: API types match the OpenAPI document
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [ledger, quantlab-python, quantlab-web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ledger:ci ledger
      - run: docker build -t quantlab:ci quantlab
